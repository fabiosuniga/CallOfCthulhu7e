<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chamado de Cthulhu 7e — Criador & Arquivo de Investigadores</title>
  <link rel="icon" type="image/png" href="./assets/app-icon-512.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap"
    rel="stylesheet"
  />
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  />
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <!-- CABEÇALHO SUPERIOR -->
  <header class="topbar">
    <div class="brand" id="btnHomeBrand" title="Voltar para Meus Investigadores">
      <img src="./assets/app-icon-512.png" alt="Logo Cthulhu" class="brand-logo" />
      <div>
        <div class="brand-title">Chamado de Cthulhu</div>
        <div class="brand-subtitle">7ª Edição • Arquivos de Investigadores</div>
      </div>
    </div>

    <div class="topbar-actions" id="topbarAuthActions" style="display:none;">
      <button type="button" class="btn btn-sm" id="btnNavInvestigators">
        <i class="fa-solid fa-user-secret"></i> Meus Investigadores
      </button>
      <button type="button" class="btn btn-sm" id="btnNavCampaigns">
        <i class="fa-solid fa-dice-d20"></i> Mesas & Campanhas
      </button>
      <button type="button" class="btn btn-primary btn-sm" id="btnNewInvestigatorTop">
        <i class="fa-solid fa-plus"></i> Novo Investigador
      </button>
      <span id="topUserEmail" style="font-size:0.78rem; color:var(--text-secondary); padding:0 0.35rem;"></span>
      <button type="button" class="btn btn-sm" id="btnTopSignOut" title="Sair da Conta">
        <i class="fa-solid fa-right-from-bracket"></i> Sair
      </button>
    </div>
  </header>

  <!-- CONTEÚDO DINÂMICO PRINCIPAL -->
  <main class="main-container" id="appRoot"></main>

  <!-- INDICADOR DE CARREGAMENTO CENTRAL (TEMÁTICA TERROR CÓSMICO) -->
  <div id="loadingOverlay" class="loading-overlay hidden" role="status" aria-live="polite">
    <div class="loading-box">
      <div class="loading-header">
        <i class="fa-solid fa-eye loading-icon" aria-hidden="true"></i>
        <span id="loadingOverlayText" class="loading-label">Consultando os Arquivos Arcanos...</span>
      </div>
      <progress id="loadingProgressBar" class="eldritch-progress" aria-labelledby="loadingOverlayText"></progress>
    </div>
  </div>

  <!-- TOAST FLUTUANTE DO ROLADOR 1D100 -->
  <aside id="diceToast" class="dice-toast hidden" aria-live="polite">
    <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:0.5rem;">
      <div>
        <div id="diceToastTitle" style="font-family:var(--font-display); font-size:0.9rem; font-weight:700; color:var(--text-primary);">
          <i class="fa-solid fa-dice-d20"></i> Teste 1D100
        </div>
        <div id="diceToastTargets" style="font-family:var(--font-mono); font-size:0.74rem; color:var(--text-secondary); margin-top:0.15rem;">
          Reg: 50% | Dif: 25% | Ext: 10%
        </div>
      </div>
      <button type="button" class="btn btn-sm" id="btnCloseDiceToast" style="padding:0.15rem 0.45rem;" aria-label="Fechar">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
    <div style="display:flex; align-items:center; justify-content:space-between; margin-top:0.65rem;">
      <div class="dice-roll-number" id="diceToastRoll">42</div>
      <span class="roll-badge regular" id="diceToastBadge">Sucesso Regular</span>
    </div>
  </aside>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
